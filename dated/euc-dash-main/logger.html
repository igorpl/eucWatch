<!doctype html>
<html lang="en">
  <head>
    <title>EUC Dash - Logger</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="js/logger.js"></script>
  </head>
  <body>
    <div class="container mt-2 pt-2">
      <div class="card mb-2">
        <div class="card-header">
          Wheel
        </div>
        <div class="card-body">
          <div class="mb-2 row">
            <label class="col-lg-3 col-form-label" for="brand">Brand:</label>
            <div class="col-lg-9">
              <select class="form-select" id="brand"></select>
            </div>
          </div>
          <div class="mb-2 row">
            <label class="col-lg-3 col-form-label" for="state">State:</label>
            <div class="col-lg-9">
              <input class="form-control" id="state" type="text" value="" disabled readonly>
            </div>
          </div>
          <div class="mb-2 row">
            <label class="col-lg-3 col-form-label" for="ble-name">BLE name:</label>
            <div class="col-lg-9">
              <input class="form-control" id="ble-name" type="text" value="" disabled readonly>
            </div>
          </div>
          <div class="mb-2 row">
            <label class="col-lg-3 col-form-label" for="info">Info:</label>
            <div class="col-lg-9">
              <input class="form-control" id="info" type="text" value="" disabled readonly>
            </div>
          </div>
          <div class="mb-2 row">
            <div class="col-lg-9 offset-lg-3">
              <div class="form-check">
                <input class="form-check-input" id="any-device" type="checkbox">
                <label class="form-check-label" for="any-device">
                  Show all devices when connecting (if the wheel is not listed)
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-2">
        <div class="card-header">
          Capture
        </div>
        <div class="card-body">
          <div class="mb-2">
            <button type="button" id="connect" class="btn btn-primary" onclick="connect()">Connect</button>
            <button type="button" id="disconnect" class="btn btn-danger" onclick="disconnect()">Disconnect</button>
          </div>
          <div class="mb-2 row">
            <label class="col-lg-3 col-form-label" for="duration">Duration (s):</label>
            <div class="col-lg-3">
              <input class="form-control" id="duration" type="number" min="1" max="600" value="10">
            </div>
          </div>
          <div class="mb-2">
            <button type="button" id="start" class="btn btn-success" onclick="startLogging()">Start logging</button>
            <button type="button" id="stop" class="btn btn-warning" onclick="stopLogging('stopped')">Stop</button>
          </div>
        </div>
      </div>

      <div class="card mb-2">
        <div class="card-header">
          Log
        </div>
        <div class="card-body">
          <textarea class="form-control font-monospace" id="log" rows="16" readonly
                    style="white-space: pre; font-size: 0.75rem"></textarea>
          <div class="mt-2">
            <button type="button" id="save" class="btn btn-primary" onclick="save()">Save</button>
            <button type="button" id="clear" class="btn btn-secondary" onclick="clearLog()">Clear</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
