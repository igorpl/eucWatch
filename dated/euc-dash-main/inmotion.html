<!doctype html>
<html lang="en">
  <head>
    <title>EUC Dash - Inmotion</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="js/inmotion.js"></script>
  </head>
  <body>
    <div class="container mt-1 pt-1">
      <button type="button" id="scan-disconnect" class="btn-lg btn-primary" onclick="scan()">Scan &amp; Connect</button>

      <form class="mt-2 pt-2">
        <div class="card mb-2 col-lg-6">
          <div class="card-header">
            Wheel info
          </div>
          <div class="card-body">
            <div class="mb-2 row">
              <label class="col-lg-5 col-form-label" for="wheel-model">Model:</label>
              <div class="col-lg-7">
                <input class="form-control" id="wheel-model" type="text" value="" disabled readonly>
              </div>
            </div>
            <div class="mb-2 row">
              <label class="col-lg-5 col-form-label" for="protocol">Protocol:</label>
              <div class="col-lg-7">
                <input class="form-control" id="protocol" type="text" value="" disabled readonly>
                <small class="form-text text-muted">picked from the service the wheel carries</small>
              </div>
            </div>
            <div class="mb-2 row">
              <label class="col-lg-5 col-form-label" for="firmware">Firmware:</label>
              <div class="col-lg-7">
                <input class="form-control" id="firmware" type="text" value="" disabled readonly>
              </div>
            </div>
            <div class="mb-2 row">
              <label class="col-lg-5 col-form-label" for="ble-name">Bluetooth name:</label>
              <div class="col-lg-7">
                <input class="form-control" id="ble-name" type="text" value="" disabled readonly>
              </div>
            </div>
            <div class="mb-2 row">
              <label class="col-lg-5 col-form-label" for="serial">Serial:</label>
              <div class="col-lg-7">
                <input class="form-control" id="serial" type="text" value="" disabled readonly>
              </div>
            </div>
            <div class="mb-2 row">
              <label class="col-lg-5 col-form-label" for="manufactured">Manufactured:</label>
              <div class="col-lg-7">
                <input class="form-control" id="manufactured" type="text" value="" disabled readonly>
              </div>
            </div>
          </div>
        </div>

        <div id="controls" class="invisible">
          <div class="card mb-2 col-lg-6">
            <div class="card-header">
              Live data
            </div>
            <div class="card-body">
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="voltage">Voltage:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="voltage" type="text" value="" disabled readonly>
                  <small class="form-text text-muted" id="voltage-help"></small>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="pack-cells">Pack:</label>
                <div class="col-lg-7">
                  <select class="form-select" id="pack-cells" onchange="setPackCells(this.value)">
                    <option value="16">16S - 67.2v</option>
                    <option value="20" selected>20S - 84v</option>
                    <option value="24">24S - 100.8v</option>
                    <option value="30">30S - 126v</option>
                  </select>
                  <small class="form-text text-muted">set from the model, change it if the percent looks wrong</small>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="battery">Battery:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="battery" type="text" value="" disabled readonly>
                  <small class="form-text text-muted">linear calculation</small>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="speed">Speed:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="speed" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="phase-current">Current:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="phase-current" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="temp">MOSFET temperature:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="temp" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="battery-temp">Battery temperature:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="battery-temp" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="total-distance">Total distance:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="total-distance" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="ride-time">Ride time:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="ride-time" type="text" value="" disabled readonly>
                  <small class="form-text text-muted">minutes</small>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="speed-limit">Speed limit:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="speed-limit" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="volume">Speaker volume:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="volume" type="text" value="" disabled readonly>
                </div>
              </div>
            </div>
          </div>

          <div id="v1-only" class="card mb-2 col-lg-6">
            <div class="card-header">
              V10 and older
            </div>
            <div class="card-body">
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="trip-distance">Trip distance:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="trip-distance" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="pitch">Pitch:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="pitch" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="work-mode">Work mode:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="work-mode" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="ride-mode">Ride mode:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="ride-mode" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="pedal-hardness">Pedal hardness:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="pedal-hardness" type="text" value="" disabled readonly>
                  <small class="form-text text-muted">percent, 100 is the hardest</small>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="pedal-tilt">Pedal tilt:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="pedal-tilt" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="lights">Lights:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="lights" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="leds">Decorative LEDs:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="leds" type="text" value="" disabled readonly>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="fault-alarms">Alerts:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="fault-alarms" type="text" value="" disabled readonly>
                </div>
              </div>
            </div>
          </div>

          <div id="v2-only" class="card mb-2 col-lg-6">
            <div class="card-header">
              V11 and newer
            </div>
            <div class="card-body">
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="pwm">PWM:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="pwm" type="text" value="" disabled readonly>
                  <small class="form-text text-muted">V13 and V14 only</small>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label" for="total-ride-time">Total ride time:</label>
                <div class="col-lg-7">
                  <input class="form-control" id="total-ride-time" type="text" value="" disabled readonly>
                  <small class="form-text text-muted">minutes, over the life of the wheel</small>
                </div>
              </div>
            </div>
          </div>

          <div class="card mb-2 col-lg-6">
            <div class="card-header">
              Controls
            </div>
            <div class="card-body">
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label">Headlight:</label>
                <div class="col-lg-7">
                  <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('lightsOn')">On</button>
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('lightsOff')">Off</button>
                  </div>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label">Ride mode:</label>
                <div class="col-lg-7">
                  <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('rideComfort')">Comfort</button>
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('rideSport')">Sport</button>
                  </div>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label">Sound:</label>
                <div class="col-lg-7">
                  <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('horn')">Horn</button>
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('beep')">Beep</button>
                  </div>
                </div>
              </div>
              <div class="mb-2 row">
                <label class="col-lg-5 col-form-label">V11 and newer only:</label>
                <div class="col-lg-7">
                  <div class="btn-group mb-2" role="group">
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('drlOn')">DRL on</button>
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('drlOff')">DRL off</button>
                  </div>
                  <div class="btn-group mb-2" role="group">
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('fanOn')">Fan on</button>
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('fanOff')">Fan off</button>
                  </div>
                  <div class="btn-group mb-2" role="group">
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('liftOn')">Lift sensor on</button>
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('liftOff')">Lift sensor off</button>
                  </div>
                  <div class="btn-group mb-2" role="group">
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('unmute')">Unmute</button>
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('mute')">Mute</button>
                  </div>
                  <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-danger" onclick="sendCommand('lock')">Lock</button>
                    <button type="button" class="btn btn-outline-primary" onclick="sendCommand('unlock')">Unlock</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
